[versions]
agp = "8.7.0"
kotlin = "2.4.10"
pedro-revhub = "3.0.2"
pedro-tuning = "1.0.3"
blaze-ftc = "0.1.67"
nextftc = "0.3.0"
panels = "0.3.2+1.0.13"

[libraries]
pedro-revhub = { group = "com.pedropathing", name = "revhub", version.ref = "pedro-revhub" }
pedro-tuning = { group = "com.pedropathing", name = "tuning", version.ref = "pedro-tuning" }

nextftc-control = { group = "dev.nextftc.v2", name = "control", version.ref = "nextftc" }
nextftc-hardware = { group = "dev.nextftc.v2", name = "hardware", version.ref = "nextftc" }
nextftc-robot = { group = "dev.nextftc.v2", name = "robot", version.ref = "nextftc" }

sloth = { group = "dev.frozenmilk.sinister", name = "sloth", version = "0.3.2" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }

blaze-ftc = { group = "dev.anygeneric", name = "blazeftc", version.ref = "blaze-ftc" }
blaze-ftc-pedro = { group = "dev.anygeneric", name = "blazeftc_pedro3", version.ref = "blaze-ftc" }

panels = { group = "com.bylazar.sloth", name = "fullpanels", version.ref = "panels" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[bundles]
pedro = [
    "pedro-revhub",
    "pedro-tuning",
]
nextftc = [
    "nextftc-control",
    "nextftc-hardware",
    "nextftc-robot"
]